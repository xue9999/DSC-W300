name: Offline verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.10'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Exercise Windows line-ending conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Required offline checks
        env:
          PYTHONUTF8: '1'
        run: python tools/run_checks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-${{ matrix.os }}-${{ matrix.python }}
          path: build/test-results.json
